<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;background:#05070d;color:#fff;font-family:Arial,Helvetica,sans-serif}
  body{min-height:100vh;overflow-x:hidden}
  .page{display:none;min-height:100vh;padding:24px 16px 44px;background:radial-gradient(ellipse at top,#0b1b32 0%,#05070d 48%,#020308 100%)}
  .page.active{display:block}
  .wrap{width:100%;max-width:680px;margin:0 auto;text-align:center}
  .profile{width:132px;height:132px;border-radius:50%;object-fit:cover;display:block;margin:18px auto 24px;border:3px solid #35c8ff;box-shadow:0 0 12px #16a9ff,0 0 30px #0874c855}
  h1{margin:0 0 14px;font-size:clamp(26px,5vw,34px);line-height:1.18;font-weight:800;letter-spacing:.4px;text-align:center;overflow-wrap:anywhere;text-shadow:0 0 18px #149dff66}
  .subtitle{margin:0 0 38px;color:#a9cce5;font-size:clamp(18px,4vw,23px);line-height:1.3;text-align:center;overflow-wrap:anywhere}
  h2{margin:0 0 24px;font-size:clamp(21px,4.5vw,26px);line-height:1.25;font-weight:800;text-align:center;overflow-wrap:anywhere}
  .buttons{display:flex;flex-direction:column;gap:16px;width:100%;align-items:stretch}
  .btn{appearance:none;width:100%;min-width:0;min-height:82px;border:1px solid #168dce;border-radius:20px;background:linear-gradient(135deg,#10263e,#0a1425 70%);color:#f5fbff;text-decoration:none;display:grid;grid-template-columns:62px minmax(0,1fr) 62px;align-items:center;column-gap:12px;padding:10px 14px;font-size:clamp(16px,3.2vw,20px);font-weight:750;line-height:1.2;text-align:center;box-shadow:0 8px 22px #007fc52b,inset 0 0 0 1px #ffffff08;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btn:hover{border-color:#50d7ff;filter:brightness(1.12)}
  .btn:active{filter:brightness(.96)}
  .btn img{width:62px;height:62px;border-radius:50%;object-fit:cover;display:block;flex:none;margin:0;justify-self:center}
  .btn .label{display:block;min-width:0;width:100%;flex:none;text-align:center;padding:0;margin:0;overflow-wrap:anywhere;word-break:normal;grid-column:2;grid-row:1;justify-self:stretch}
  /* Keep the main button's label centered in the full button, not shifted toward the left icon. */
  #home .buttons > button.btn .label{grid-column:1 / -1;grid-row:1;z-index:1;padding:0 8px}
  #home .buttons > button.btn img{grid-column:1;grid-row:1;z-index:2}
  #home .buttons > button.btn::after{content:"";grid-column:3;grid-row:1;width:62px;height:1px}
  .discord{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;text-align:center}
  .discord .label{width:auto;flex:0 1 auto;padding:0;min-width:0}
  .discord-icon{width:58px;height:58px;flex:0 0 58px;display:block}
  .platform{width:38px;height:38px;display:block;flex:none;margin:0;justify-self:center;grid-column:3;grid-row:1}
  .back{width:100%;border:1px solid #168dce;background:#0b1b2d;color:#fff;border-radius:42px;padding:16px 20px;font-size:20px;font-weight:700;margin:0 0 24px;cursor:pointer;box-shadow:0 0 18px #007fc522;-webkit-tap-highlight-color:transparent}
  .back:active{filter:brightness(.96)}
  @media(max-width:420px){
    .page{padding:18px 12px 32px}
    .profile{width:116px;height:116px;margin:14px auto 22px}
    h1{font-size:27px}
    .subtitle{font-size:19px;margin-bottom:32px}
    h2{font-size:21px;margin-bottom:20px}
    .buttons{gap:14px}
    .btn{grid-template-columns:48px minmax(0,1fr) 34px;column-gap:8px;min-height:74px;padding:8px 9px;font-size:16px;border-radius:16px}
    .btn img{width:48px;height:48px}
    #home .buttons > button.btn .label{padding:0 4px}
    #home .buttons > button.btn::after{width:34px}
    .platform{width:32px;height:32px}
    .discord{gap:10px}
    .discord-icon{width:48px;height:48px;flex-basis:48px}
    .back{font-size:18px;padding:14px 16px}
  }
  @media(max-width:340px){
    .btn{grid-template-columns:40px minmax(0,1fr) 28px;column-gap:6px;font-size:14px;padding:7px}
    .btn img{width:40px;height:40px}
    #home .buttons > button.btn::after{width:28px}
    .platform{width:27px;height:27px}
  }

  .captcha-overlay{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.78)}
  .captcha-overlay.open{display:flex}
  .captcha-box{position:relative;width:min(100%,360px);min-height:90px;padding:48px 16px 20px;background:#fff;border-radius:14px;box-shadow:0 18px 60px #0009;display:flex;align-items:center;justify-content:center}
  .captcha-close{position:absolute;top:8px;right:10px;width:32px;height:32px;border:0;border-radius:8px;background:#f0f0f0;color:#222;font-size:24px;line-height:1;cursor:pointer}
  #hcaptcha-holder{min-height:65px;display:flex;align-items:center;justify-content:center;max-width:100%}
  @media(max-width:360px){.captcha-box{padding-left:8px;padding-right:8px} #hcaptcha-holder{transform:scale(.92);transform-origin:center}}

/* Lightweight static winter theme: no moving layers or animation */
:root{--winter-ice:#b9eaff;--winter-deep:#071522}
html,body{background:#071522!important;color:#f4fbff!important}
.page{background:linear-gradient(180deg,#102b40 0%,#081a29 48%,#050d16 100%)!important}

.btn,.back{border-color:#78c9ed!important;background:linear-gradient(135deg,#153b55,#0a2032 75%)!important;box-shadow:0 5px 14px #00101d66!important}
.btn:before,.btn:after{content:none!important}
.back{color:#f0faff!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}
</style>

<script>
  function showPage(id){
    document.querySelectorAll('.page').forEach(page => {
      page.classList.remove('active');
    });

    const target = document.getElementById(id);
    if(target) target.classList.add('active');

    window.scrollTo(0,0);
    history.replaceState(null, '', id === 'downloads' ? '#downloads' : '#home');
  }

  if(location.hash === '#downloads'){
    showPage('downloads');
  }
</script>


<div id="captcha-overlay" class="captcha-overlay" aria-hidden="true">
  <div class="captcha-box" role="dialog" aria-modal="true" aria-label="Verification">
    <button id="captcha-close" class="captcha-close" type="button" aria-label="Close">×</button>
    <div id="hcaptcha-holder"></div>
  </div>
</div>
<script>
  (function(){
    const SITE_KEY = "75a41e52-548a-44c2-af8c-43ac16a25fa0";
    const overlay = document.getElementById("captcha-overlay");
    const holder = document.getElementById("hcaptcha-holder");
    const closeButton = document.getElementById("captcha-close");
    let pendingUrl = "";
    let widgetId = null;
    let renderRequested = false;

    function closeCaptcha(){
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      pendingUrl = "";
      if (window.hcaptcha && widgetId !== null) {
        try { window.hcaptcha.reset(widgetId); } catch(e) {}
      }
    }

    function onVerified(){
      const destination = pendingUrl;
      if (!destination) return;
      // Allow hCaptcha to show its own verified state before navigation.
      window.setTimeout(function(){
        if (pendingUrl !== destination) return;
        window.location.href = destination;
      }, 1500);
    }

    function renderWidget(){
      if (!window.hcaptcha || renderRequested) return;
      renderRequested = true;
      widgetId = window.hcaptcha.render(holder, {
        sitekey: SITE_KEY,
        callback: onVerified,
        "error-callback": function(){},
        "expired-callback": function(){ pendingUrl = ""; }
      });
    }

    window.hcaptchaOnLoad = renderWidget;
    const script = document.createElement("script");
    script.src = "https://js.hcaptcha.com/1/api.js?onload=hcaptchaOnLoad&render=explicit";
    script.async = true;
    script.defer = true;
    document.head.appendChild(script);

    document.addEventListener("click", function(event){
      const link = event.target.closest("a[href]");
      if (!link) return;
      const href = link.getAttribute("href");
      if (!href || href.startsWith("#") || link.hasAttribute("data-no-captcha")) return;
      // Apply the challenge only to the download links and Discord invite.
      const isDownload = link.closest("#downloads") && (
        link.getAttribute("aria-label") === "Download FF Private Server 2023 Android" ||
        link.getAttribute("aria-label") === "Download FF Private Server 2023 iOS"
      );
      const isDiscord = link.getAttribute("aria-label") === "Join Your Discord";
      if (!isDownload && !isDiscord) return;

      event.preventDefault();
      pendingUrl = link.href;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      renderWidget();
      if (window.hcaptcha && widgetId !== null) {
        try { window.hcaptcha.reset(widgetId); } catch(e) {}
      }
    });

    closeButton.addEventListener("click", closeCaptcha);
    overlay.addEventListener("click", function(event){
      if (event.target === overlay) closeCaptcha();
    });
    document.addEventListener("keydown", function(event){
      if (event.key === "Escape" && overlay.classList.contains("open")) closeCaptcha();
    });
  })();
</script>
